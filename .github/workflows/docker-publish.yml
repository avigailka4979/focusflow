# Builds the backend and frontend images for linux/amd64 and pushes them to
# GitHub Container Registry (ghcr.io/<owner>/focusflow-backend|frontend:latest).
# After the first run: GitHub > your profile > Packages > each package >
# Package settings > Change visibility > Public.
name: Build and publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest mongomock httpx
      - run: cd backend && python -m pytest -q

  publish:
    needs: test-backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/focusflow-${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER }}/focusflow-${{ matrix.service }}:${{ github.sha }}
